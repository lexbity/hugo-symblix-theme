baseURL = "http://localhost:1313/"
title = "Symblix Example"
theme = "hugo-theme-symblix"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[taxonomies]
tag = "tags"
topic = "topics"

# unsafe = true removed — theme does not require raw HTML in markdown.
# Extend via shortcodes instead.

# Optional: build CSS from Tailwind source instead of the committed pre-built CSS.
# Enable together with `npm run dev` (which sets HUGO_PARAMS_DOCS_TAILWINDSOURCE=true).
[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[outputs]
home = ["HTML", "RSS", "SearchIndex"]

[outputFormats.SearchIndex]
baseName = "search-index"
mediaType = "application/json"
isPlainText = true
notUgly = true

[params.docs]
root = "docs"
logo = ""
logoAlt = "Symblix"
rightToc = true
versions = { noindexArchived = true }

# Project links rendered in the site footer. rel="me" makes these usable
# for identity verification (e.g. Mastodon).
[[params.docs.social]]
name = "GitHub"
url = "https://github.com/lexbity/hugo-symblix-theme"

# Front-page chrome: "topbar" (header bar, default) or "rail"
# (Material-style vertical icon rail from 48rem up; the header with its
# no-JS dropdown stays as the mobile chrome). Developer choice, not
# user-switchable.
[params.docs.frontPage]
chrome = "rail"

[params.docs.footer]
copyright = "Symblix authors"
licenseURL = "https://opensource.org/licenses/MIT"
licenseLabel = "MIT"
poweredBy = true
description = "Versioned, multilingual documentation without JavaScript."
# Expanded footer columns: one column per entry, rendering the named Hugo
# menu. Menus are defined per language below; omit `columns` to keep the
# slim footer.
[[params.docs.footer.columns]]
title = "Product"
menu = "footer"

[[params.docs.footer.columns]]
title = "Community"
menu = "footerCommunity"

[[params.docs.footer.columns]]
title = "Project"
menu = "footerProject"

[params.docs.validation]
showAuthorWarnings = false

[params.docs.components.reference]
headingLevel = 3
showLifecycleBadges = true

[params.docs.nav]
mode = "manual"
data = "docs_nav"

# Visual identity: color presets and typography
# See: data/docs_presets.yaml for available presets
# Motion subsystem (SYM-MOT-002). debug reserves verbose diagnostics; measured
# startup/CPU timings are delivered in its diagnostics slice. viewTransitions opts the site
# into cross-document view transitions (Chromium-class browsers; inert
# elsewhere, no-JS behavior unchanged).
[params.docs.motion]
debug = false
viewTransitions = true

[params.docs.theme]
# Default color preset (must be a preset ID from data/docs_presets.yaml)
preset = "symblix-light"
# Presets available in the switcher (subset of all defined presets)
availablePresets = [
  "symblix-light",
  "symblix-dark",
  "ocean-dark",
  "forest-light",
  "sunset-dark",
  "solarized-light",
  "high-contrast",
]
# Visual preset: minimal (sharp corners), rounded, or high-contrast
visualPreset = "minimal"
# Density: comfortable, compact, or dense
density = "comfortable"
# Font stacks (bundled fonts with system fallbacks)
fonts = { body = "Inter, ui-sans-serif, system-ui, -apple-system, sans-serif", mono = "JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" }

[params.features]
themeSwitcher = true

[params.seo]
openGraph = true
twitterCards = true
# Set a default social sharing image (1200x630 recommended):
# [params]
# images = ["images/og-image.png"]

[languages.en]
label = "English"
locale = "en-US"
direction = "ltr"
weight = 1
contentDir = "content/en"

# Footer column titles per language (menus are identical; titles translate).
# English titles come from the site-level columns block.

[languages.fr]
label = "Français"
locale = "fr-FR"
direction = "ltr"
weight = 2
contentDir = "content/fr"

[[languages.fr.params.docs.footer.columns]]
title = "Produit"
menu = "footer"

[[languages.fr.params.docs.footer.columns]]
title = "Communauté"
menu = "footerCommunity"

[[languages.fr.params.docs.footer.columns]]
title = "Projet"
menu = "footerProject"

[languages.ja]
label = "日本語"
locale = "ja-JP"
direction = "ltr"
weight = 3
contentDir = "content/ja"

[[languages.ja.params.docs.footer.columns]]
title = "製品"
menu = "footer"

[[languages.ja.params.docs.footer.columns]]
title = "コミュニティ"
menu = "footerCommunity"

[[languages.ja.params.docs.footer.columns]]
title = "プロジェクト"
menu = "footerProject"

[languages.ar]
label = "العربية"
locale = "ar"
direction = "rtl"
weight = 4
contentDir = "content/ar"

[[languages.ar.params.docs.footer.columns]]
title = "المنتج"
menu = "footer"

[[languages.ar.params.docs.footer.columns]]
title = "المجتمع"
menu = "footerCommunity"

[[languages.ar.params.docs.footer.columns]]
title = "المشروع"
menu = "footerProject"

# Front-page header links, rendered top right. Defined per language so
# pageRef resolves inside each language's content tree; languages without a
# header menu show the logo only. The GitHub/social links below render as
# SVG icons; the rail additionally reads each entry's `params.icon` to
# pick a glyph (see docs/helpers/icon-svg.html for shipped names).
[[languages.en.menus.header]]
name = "Home"
pageRef = "/"
weight = 5
  [languages.en.menus.header.params]
  icon = "home"

[[languages.en.menus.header]]
name = "Docs"
pageRef = "/docs/latest/"
weight = 10
  [languages.en.menus.header.params]
  icon = "book-open"

[[languages.en.menus.header]]
name = "Components"
pageRef = "/docs/latest/components/"
weight = 20

# Header rail menus for the remaining languages (translated labels).
  [languages.en.menus.header.params]
  icon = "blocks"

