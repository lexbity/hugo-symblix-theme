<!doctype html>
<html
  lang="{{ partial "docs/helpers/language-code.html" . }}"
  dir="{{ or .Site.Language.Direction "ltr" }}"
  {{ with site.Params.docs.theme.density }}data-docs-density="{{ . }}"{{ end }}
  {{ with site.Params.docs.theme.preset }}data-docs-preset="{{ . }}"{{ end }}
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "scripts.html" . }}
    {{ partial "docs/site-footer.html" . }}
  </body>
</html>
