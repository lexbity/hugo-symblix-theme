{{- $src := .Destination -}}
{{- if and (not (hasPrefix $src "http://")) (not (hasPrefix $src "https://")) -}}
  {{- $src = $src | relURL -}}
{{- end -}}
{{- $alt := .Text | default "" -}}
{{- $title := .Title | default "" -}}
<figure class="docs-markdown-figure">
  <img class="docs-markdown-image" src="{{ $src | safeURL }}" alt="{{ $alt | plainify }}" loading="lazy" decoding="async"{{ with $title }} title="{{ . | plainify }}"{{ end }}>
  {{- if $title -}}
    <figcaption class="docs-markdown-figure__caption">{{ $title | markdownify }}</figcaption>
  {{- end -}}
</figure>
