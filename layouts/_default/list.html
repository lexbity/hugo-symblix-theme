{{ define "main" }}
  <section>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
    {{ .Content }}
    {{ with .Pages }}
      <ul>
        {{ range .ByWeight }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    {{ end }}
  </section>
{{ end }}
