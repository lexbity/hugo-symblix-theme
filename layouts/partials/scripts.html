{{/* Pre-paint sidebar opener (D-09): open sidebar on desktop (≥64rem) before first paint.
   Runs inline during parse, after sidebar element exists. Mirrors CSS breakpoint exactly. */}}
<script>
  (function () {
    try {
      if (window.matchMedia("(min-width: 64rem)").matches) {
        document.querySelectorAll("[data-sidebar]").forEach(function (d) { d.open = true; });
      }
    } catch (error) {}
  })();
</script>
