{{ if site.Params.features.themeSwitcher }}
  <section class="docs-switcher docs-switcher--theme" data-theme-switcher>
    <label class="docs-switcher-label" for="docs-theme-choice">{{ i18n "theme" | default "Theme" }}</label>
    <select id="docs-theme-choice" class="docs-switcher-select docs-theme-select" data-theme-select>
      <option value="system">{{ i18n "system" | default "System" }}</option>
      <option value="light">{{ i18n "light" | default "Light" }}</option>
      <option value="dark">{{ i18n "dark" | default "Dark" }}</option>
    </select>
  </section>
{{ end }}
