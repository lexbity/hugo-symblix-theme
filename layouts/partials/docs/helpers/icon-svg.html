{{- /* Inline SVG glyph set for the generic icon helper (SYM-VIS-002).
       Stroke-based 24×24 icons drawn with currentColor so they inherit the
       surrounding text color and adapt to every color preset. Known names
       return the full <svg> markup; unknown names return "" and the caller
       (icon.html) falls back to the legacy text span.

       Shipped names: home, docs, book-open, blocks, grid, download,
       git-branch, languages, globe, zap, search, terminal, package, play,
       wrench, tool, graduation-cap, sparkles, compass, file-code, layers,
       menu, close, x — plus legacy aliases (start, browse, static, versions)
       kept for content written before the glyph set existed.

       The path bodies are interpolated through safeHTML in content position;
       the element attributes are written literally (attribute-name context
       cannot interpolate without Hugo's ZgotmplZ escaping).

       Override this partial to add more glyphs. Brand icons (github, x,
       bluesky, youtube, rss) live in social-icon.html instead. */ -}}

{{- $class := .Class | default "" -}}

{{- $body := index $glyphs $name -}}
{{- if $body -}}
<svg class="docs-icon-glyph{{ with $class }} {{ . }}{{ end }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{{ $body | safeHTML }}</svg>
