{{- /* docs/custom-head.html (extension hook) */ -}}
{{- if eq .Type "showcase" -}}
{{- $css := resources.Get "css/motion-lab.css" -}}
{{- if $css -}}
{{- $css = $css | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{- end -}}
{{- end -}}
