# Symblix default color presets
#
# Each preset defines a complete color system: base colors, callout colors,
# and badge colors. Projects can override these by creating their own
# data/docs_presets.yaml (Hugo merges data files by key).
#
# Schema (per preset):
#   id:          unique identifier, lowercase-hyphenated (REQUIRED)
#   label:       human-readable name (REQUIRED)
#   description: short description (OPTIONAL)
#   mode:        "light" or "dark" — determines syntax highlighting (REQUIRED)
#   colors:      base color tokens (REQUIRED, all 7 keys)
#     bg, surface, surface2, text, muted, border, accent
#   callouts:    semantic callout colors (OPTIONAL, derived if absent)
#     note, tip, info, warning, danger, success, deprecated, experimental
#   badges:      badge colors (OPTIONAL, derived if absent)
#     info, warning, success, danger

presets:
  # ─────────────────────────────────────────────────────────────────────────
  # symblix-light — Clean, neutral light theme with blue accent
  # ─────────────────────────────────────────────────────────────────────────
  - id: symblix-light
    label: Symblix Light
    description: Clean, neutral light theme with blue accent
    mode: light
    colors:
      bg: "#f8fafc"
      surface: "#ffffff"
      surface2: "#f1f5f9"
      text: "#0f172a"
      muted: "#475569"
      border: "#dbe2ea"
      accent: "#2563eb"
    callouts:
      note: "#64748b"
      tip: "#10b981"
      info: "#3b82f6"
      warning: "#f59e0b"
      danger: "#ef4444"
      success: "#22c55e"
      deprecated: "#8b5cf6"
      experimental: "#f97316"
    badges:
      info: "#3b82f6"
      warning: "#f59e0b"
      success: "#22c55e"
      danger: "#ef4444"

  # ─────────────────────────────────────────────────────────────────────────
  # symblix-dark — Deep, focused dark theme with blue accent
  # ─────────────────────────────────────────────────────────────────────────
  - id: symblix-dark
    label: Symblix Dark
    description: Deep, focused dark theme with blue accent
    mode: dark
    colors:
      bg: "#02030a"
      surface: "#070d18"
      surface2: "#0d1424"
      text: "#e5e7eb"
      muted: "#94a3b8"
      border: "rgb(148 163 184 / 0.16)"
      accent: "#4aa3ff"
    callouts:
      note: "#94a3b8"
      tip: "#34d399"
      info: "#60a5fa"
      warning: "#fbbf24"
      danger: "#f87171"
      success: "#4ade80"
      deprecated: "#a78bfa"
      experimental: "#fb923c"
    badges:
      info: "#60a5fa"
      warning: "#fbbf24"
      success: "#4ade80"
      danger: "#f87171"

  # ─────────────────────────────────────────────────────────────────────────
  # ocean-dark — Deep blue-teal dark theme, easy on the eyes
  # ─────────────────────────────────────────────────────────────────────────
  - id: ocean-dark
