{{- /* Favicon template.
   Receives the resolved light accent color via .accent (hex string). */ -}}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="{{ .accent }}"/>
  <rect x="9" y="7" width="14" height="18" rx="2" fill="#ffffff"/>
  <rect x="12" y="11" width="8" height="2" rx="1" fill="{{ .accent }}"/>
  <rect x="12" y="15" width="8" height="2" rx="1" fill="{{ .accent }}"/>
  <rect x="12" y="19" width="5" height="2" rx="1" fill="{{ .accent }}"/>
</svg>